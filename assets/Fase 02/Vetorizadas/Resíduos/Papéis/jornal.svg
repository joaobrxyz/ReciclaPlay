         style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-size:4.93889px;font-family:Cambria;-inkscape-font-specification:'Cambria Bold';stroke-width:0;stroke-dasharray:none"
         x="41.303364"
         y="117.95472">Palmeiras campeão da libertadores!</tspan></text><text
       xml:space="preserve"
       style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-size:4.93889px;line-height:0.9;font-family:Cambria;-inkscape-font-specification:'Cambria, Bold';writing-mode:lr-tb;direction:ltr;fill:#000000;stroke:#000000;stroke-width:0;stroke-dasharray:none;font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal"
       x="40.713375"
       y="148.15717"
       id="text6-5"><tspan
         sodipodi:role="line"
         id="tspan47">Santos perde para o Fortaleza e é </tspan><tspan
         sodipodi:role="line"
         id="tspan48">rebaixado pela 1ª vez no Brasileirão</tspan></text><text
       xml:space="preserve"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:2.4231px;line-height:0.9;font-family:Cambria;-inkscape-font-specification:'Cambria, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;writing-mode:lr-tb;direction:ltr;fill:#000000;stroke:#000000;stroke-width:0;stroke-dasharray:none"
       x="49.888546"
       y="103.55933"
       id="text7"
       transform="scale(0.8305134,1.2040745)"><tspan
         sodipodi:role="line"
         id="tspan40">De novo com emoção, de novo com um herói improvável, o alviverde continua imponente e dono da América. O Palmeiras se tornou tricampeão </tspan><tspan
         sodipodi:role="line"
         id="tspan41">da Libertadores depois de vencer o Flamengo por 2 a 1 na tarde deste sábado, em Montevidéu, no Uruguai, e manteve o domínio continental com o</tspan><tspan
         sodipodi:role="line"
         id="tspan42">segundo título seguido – já havia vencido a edição de 2020 em janeiro, contra o Santos, no Maracanã. Se no início do ano foi Breno Lopes, desta vez foi</tspan><tspan
         sodipodi:role="line"
         id="tspan43">Deyverson o responsável por decidir a favor do Verdão. Na prorrogação, provocou falha de Andreas Pereira, avançou sozinho e fez o gol do título </tspan><tspan
         sodipodi:role="line"
         id="tspan44">Raphael Veiga e Gabigol marcaram no 1 a 1 do tempo normal. Após um jogo praticamente impecável, o time de Abel Ferreira vai mais uma vez para</tspan><tspan
         sodipodi:role="line"
         id="tspan45">o Mundial de Clubes, no início do ano que vem. Enquanto isso, é hora de comemorar mais uma vez: a América continua inteira pintada em tons de</tspan><tspan
         sodipodi:role="line"
         id="tspan46">verde.</tspan></text><text
       xml:space="preserve"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:2.4231px;line-height:0.9;font-family:Cambria;-inkscape-font-specification:'Cambria, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;writing-mode:lr-tb;direction:ltr;fill:#000000;stroke:#000000;stroke-width:0;stroke-dasharray:none"
       x="48.638103"
       y="132.14061"
       id="text7-5"
       transform="scale(0.8305134,1.2040745)"><tspan
         sodipodi:role="line"
         id="tspan52">O Santos caiu para a Série B. Com a derrota por 2 a 1 para o Fortaleza e as vitórias de Bahia e Vasco, o Peixe amargou, nesta quarta-feira (6), pela primeira </tspan><tspan
         sodipodi:role="line"
         id="tspan53">vez a sensação de ser rebaixado para a 2ª divisão do Brasileirão, nesta quarta-feira (6), pela 38ª rodada. A queda veio logo na primeira edição do nacional </tspan><tspan
         sodipodi:role="line"
         id="tspan54">desde a morte do Rei Pelé.</tspan></text></g></svg>
